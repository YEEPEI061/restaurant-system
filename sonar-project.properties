sonar.projectKey=aurelia-restaurant-system
sonar.projectName=Aurelia Restaurant System
sonar.projectVersion=1.3

sonar.host.url=http://localhost:9000

# Source directories
sonar.sources=backend,frontend/src

# Test file identification
sonar.test.inclusions=**/*.spec.ts,**/*.test.js,**/*.test.ts

# Exclude generated and dependency files
sonar.exclusions=**/node_modules/**,**/.angular/**,**/dist/**,**/coverage/**,**/build/**

# Coverage reports (backend + frontend)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8