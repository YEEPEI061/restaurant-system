name: Aurelia Application CI/CD

on:
  push:
    branches:
      - main

  pull_request:

jobs:

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      NODE_ENV: test
      MONGO_TEST_URI: mongodb://localhost:27017/aurelia_test
      JWT_SECRET: aurelia_ci_test_secret

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test


  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Angular tests
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build Angular application
        working-directory: frontend
        run: npm run build


  deploy:
    name: Deploy Aurelia

    needs:
      - backend-ci
      - frontend-ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Create production environment file
        shell: powershell
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          MONGO_APP_USERNAME: ${{ secrets.MONGO_APP_USERNAME }}
          MONGO_APP_PASSWORD: ${{ secrets.MONGO_APP_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

        run: |
          @(
            "MONGO_INITDB_ROOT_USERNAME=$env:MONGO_INITDB_ROOT_USERNAME"
            "MONGO_INITDB_ROOT_PASSWORD=$env:MONGO_INITDB_ROOT_PASSWORD"
            "MONGO_DB=$env:MONGO_DB"
            "MONGO_APP_USERNAME=$env:MONGO_APP_USERNAME"
            "MONGO_APP_PASSWORD=$env:MONGO_APP_PASSWORD"
            "JWT_SECRET=$env:JWT_SECRET"
          ) | Set-Content -Path .env -Encoding ascii

      - name: Deploy using Docker Compose
        run: docker compose up -d --build

      - name: Verify deployment
        run: docker compose ps
